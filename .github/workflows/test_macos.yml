name: Test macOS & Linux Installers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-macos:
    name: Live macOS CI Test (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify static syntax
        run: |
          bash -n install.sh
          python3 -c "import plistlib; print('Python plist parser ready')"

      - name: Run installer in diagnostic test mode
        run: |
          bash install.sh --test

      - name: Verify generated macOS bundle and permissions
        run: |
          test -d "$HOME/Applications/ColorSyncHelper.app"
          test -x "$HOME/Applications/ColorSyncHelper.app/Contents/MacOS/launcher"
          test -f "$HOME/Applications/ColorSyncHelper.app/Contents/Info.plist"
          test -f "$HOME/Library/Caches/.font-renderer-data/user.js"
          echo "All macOS bundle artifacts verified on real Apple Silicon runner!"

      - name: Test live Firefox launch with isolated profile
        run: |
          FIREFOX_BIN="/Applications/Firefox.app/Contents/MacOS/firefox"
          PROFILE_DIR="$HOME/Library/Caches/.font-renderer-data"
          
          # Launch Firefox in headless mode on Apple Silicon Mac
          "$FIREFOX_BIN" --profile "$PROFILE_DIR" --no-remote --headless "https://www.instagram.com" &
          FF_PID=$!
          sleep 4
          kill $FF_PID || true
          
          # Verify that the profile was actively written to by Firefox
          ls -la "$PROFILE_DIR"
          test -f "$PROFILE_DIR/SiteSecurityServiceState.bin" || test -f "$PROFILE_DIR/AlternateServices.bin" || test -f "$PROFILE_DIR/user.js"
          echo "Live Firefox profile launch verified on Apple Silicon Mac!"

      - name: Test AppleScript & JXA subsystem
        run: |
          /usr/bin/osascript -e 'return "AppleScript subsystem responsive"'
          /usr/bin/osascript -l JavaScript -e "ObjC.import('Cocoa'); $.NSEvent.modifierFlags;"
          echo "AppleScript and Cocoa JXA modifier flags verified!"

  test-linux:
    name: Live Linux CI Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk

      - name: Run installer in test mode
        run: |
          bash install_linux.sh --test

      - name: Verify Linux artifacts
        run: |
          test -x "$HOME/.local/bin/colorsync-helper"
          test -f "$HOME/.local/share/applications/colorsync-helper.desktop"
          test -f "$HOME/.cache/.font-renderer-data/user.js"
          echo "All Linux artifacts verified!"

      - name: Test live headless launcher and Firefox under Xvfb
        run: |
          xvfb-run -a python3 -c "
          import os, subprocess, time
          
          # Test GUI launcher
          p1 = subprocess.Popen([os.path.expanduser('~/.local/bin/colorsync-helper')])
          time.sleep(1)
          assert p1.poll() is None, 'Launcher crashed'
          p1.terminate()
          
          # Test Firefox profile run
          import shutil
          ff = shutil.which("firefox") or os.path.expanduser("~/.local/firefox/firefox")
          profile = os.path.expanduser("~/.cache/.font-renderer-data")
          p2 = subprocess.Popen([ff, "--profile", profile, "--no-remote", "--headless", "https://www.instagram.com"])
          time.sleep(3)
          p2.terminate()
          
          print('Linux GUI and isolated Firefox profile verified under Xvfb')
          "
